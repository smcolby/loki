# The local hostname used to reach the server from other devices on your network.
# Use the .local TLD to enable mDNS resolution without any router configuration.
# See the README for setup instructions on Linux and macOS.
url: loki.local

# Host ports exposed by the Docker Compose services.
# Change these if the defaults conflict with other services on your machine.
ports:
  caddy: 80      # Port for the Caddy reverse proxy (Open WebUI).
  kiwix: 8080    # Port for the Kiwix offline knowledge server.
  api: 8090      # Port for the OpenAI/Anthropic-compatible model API (all engines).

# llama-server runs in a container built for one AMD GPU from a pinned llama.cpp commit.
llama:
  # Each subdirectory holding a preset.ini is served as one model (see README).
  models_dir: ~/.llms
  ref: 5d806aa2575e01e126651fd69ab1ab6cefff861d  # llama.cpp commit to build
  gpu_targets: gfx1100   # AMD GPU architecture (rocminfo | grep gfx)
  rocm_version: 7.2.4    # ROCm build toolchain and bundled runtime
  max_loaded: 1          # Models kept in VRAM at once; least recently used is unloaded
  # Options every model gets unless its preset.ini overrides them
  # (llama-server long option names without the leading dashes).
  defaults:
    n-gpu-layers: 99     # Keep every layer on the GPU
    fit: "off"           # Fail loudly instead of shrinking context or layers to fit
    flash-attn: "on"
    cache-type-k: q4_0   # Quantized KV cache for long contexts
    cache-type-v: q4_0
    parallel: 1          # One request slot, so the full context goes to it
    cache-ram: 8192      # MiB of host RAM for reusable prompt prefixes
    ctx-checkpoints: 32

# Strata serves mixture-of-experts models (Qwen3.8-Flash-Next and its fine-tunes)
# behind the same API, one container per engine. Only one engine holds the GPU at
# a time: the gateway unloads the others before switching.
strata:
  # Engine name -> engine config in data_dir (see README); empty leaves Strata out.
  # Each runs as Compose service strata-<name>, for example:
  #   qwen: qwen.json
  #   swift: swift.json
  engines: {}
  # Holds the engine configs (engine args, tokenizer, model name) and the files they name.
  data_dir: ~/.llms/strata
  ref: 6f32ec070f23ced9f50e704d854d775da52591ab  # Strata commit to build
  gpu_targets: gfx1100            # AMD GPU architecture (rocminfo | grep gfx)
  rocm_version: 7.10.0a20251120   # TheRock ROCm wheels for the build and runtime

# stable-diffusion.cpp's sd-server generates images at /v1/images/generations, one
# container per engine. It shares the GPU with the text engines through the gateway
# and frees its weights after each image (--params-backend disk).
image:
  # Engine name -> model id and sd-server arguments; empty leaves image generation out.
  # Each runs as Compose service image-<name>, for example:
  #   qwen:
  #     model: qwen-image-2.1-q8_0
  #     args: [--diffusion-model, /home/you/.llms/qwen-image-2.1/qwen-image-2.1-Q8_0.gguf,
  #            --llm, ..., --llm_vision, ..., --vae, ..., --params-backend, disk, --diffusion-fa,
  #            --strength, "1.0", --ref-image-args, vae_input_max_pixels=1048576]
  engines: {}
  models_dir: ~/.llms     # Holds the model files the engines name; mounted read-only
  ref: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c  # stable-diffusion.cpp commit to build
  gpu_targets: gfx1100    # AMD GPU architecture (rocminfo | grep gfx)
  rocm_version: 7.2.4     # ROCm build toolchain and bundled runtime

# Kokoro-FastAPI reads replies aloud in Open WebUI. It runs on the CPU, so playing
# a reply never unloads the chat model. Point Open WebUI's text-to-speech settings
# at http://kokoro:8880/v1 (see README).
tts:
  enabled: false
  image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0  # Kokoro-FastAPI release
  voice: af_heart        # Voice used when a request names none

# Text model the gateway loads when it starts, so the first prompt skips the load.
# It stays loaded until a request for another model swaps it out. Leave it out to
# load nothing until the first request, for example:
#   preload: qwen3.8-27b-iq4xs

# ZIM archives to download during `loki setup`.
# Each entry requires a name (used for display) and a direct download URL.
kiwix_files:
  - name: wikipedia_en_all_nopic
    url: https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_nopic_2025-12.zim

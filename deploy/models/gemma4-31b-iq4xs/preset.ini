; Gemma 4 31B IQ4_XS with its separate MTP drafter (gemma4-assistant, 4 layers
; sharing the target's KV cache) from huggingface.co/unsloth/gemma-4-31B-it-GGUF
[gemma4-31b-iq4xs]
model = gemma-4-31B-it-IQ4_XS.gguf
model-draft = mtp-gemma-4-31B-it-Q8_0.gguf
spec-type = draft-mtp

; Swept n=0..5 on 2026-09-14 under Ollama (essay prompt with thinking on, ROCm/q4_0):
; 32.8, 48.0, 59.2, 62.1, 60.9, 55.5 tok/s; n=3 peaks
spec-draft-n-max = 3
spec-draft-backend-sampling = true

ctx-size = 163840

; Sampling per model card (huggingface.co/unsloth/gemma-4-31B-it-GGUF)
temp = 1.0
top-p = 0.95
top-k = 64

; Qwen3.8-27B UD-IQ4_XS with its embedded MTP head and vision projector
[qwen3.8-27b-iq4xs]
model = Qwen3.8-27B-UD-IQ4_XS.gguf
mmproj = mmproj-Qwen3.8-27B-Q8_0.gguf

; Native trained context; only 16 of 64 layers are full-attention, so q4_0 KV
; at 262144 stays near 4GB
ctx-size = 262144
batch-size = 1024
ubatch-size = 1024

; Embedded MTP head. Swept n=1..5 on 2026-08-19 under Ollama (ROCm/q4_0): 56.1,
; 71.1, 75.9, 73.0, 68.5 tok/s; n=3 peaks
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-backend-sampling = true

; Qwen3.8-27B thinking-mode sampling for coding tasks (per model card)
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0
presence-penalty = 0
repeat-penalty = 1

; Muse Glimmer 30B UD-Q4_K_XL with its DFlash drafter
[muse-glimmer-30b-q4]
model = Muse-Glimmer-30B-UD-Q4_K_XL.gguf
model-draft = dflash-kquant.gguf
spec-type = draft-dflash

; Swept n=0,2,4,8,12,15,16 on 2026-09-16 under Ollama (prose prompt, ROCm/q4_0):
; 40.2, 50.1, 39.2, 41.5, 42.9, 40.2, 40.0 tok/s; n=2 peaks
spec-draft-n-max = 2

; GGUF context_length patched 131072 -> 262144 in both files: only the 39
; sliding-window layers use RoPE and the 13 global layers are NoPE
ctx-size = 262144

; GGUF template plus a guard that rejects enable_thinking=false (reasoning_effort
; none): llama.cpp's Glimmer parser has no off switch and would otherwise ignore it
chat-template-file = chat-template.jinja

; Sampling per model card (huggingface.co/unsloth/Muse-Glimmer-30B-GGUF)
temp = 1.0
top-p = 0.95
top-k = 64

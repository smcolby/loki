; Swift 1.5 Qwen3.8-27B IQ4_XS with its embedded MTP head, text only
[swift-qwen3.8-27b-iq4xs]
model = Swift-1.5-Qwen3.8-27B-IQ4_XS.gguf

; Vision projector (mmproj-Swift-1.5-Qwen3.8-27B-F16.gguf) not downloaded: its ~0.9GB
; weights plus compute buffer run out of VRAM at 262144 context; qwen3.8-27b-iq4xs keeps vision
ctx-size = 262144
batch-size = 1024
ubatch-size = 1024

; Embedded MTP head; width carried over from the qwen3.8-27b-iq4xs sweep
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-backend-sampling = true

; Swift 1.5 thinking-mode sampling (per huggingface.co/ukisai/Swift-1.5-Qwen3.8-27B-GGUF)
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0
presence-penalty = 0
repeat-penalty = 1

# Strata engines come from compose.strata.yaml, which loki generates from config.yaml
# and passes alongside this file.
services:
  gateway:
    # One API for every engine: merges model lists and hands the GPU to one engine at a time.
    build:
      context: ./gateway
    image: ${GATEWAY_IMAGE:?run loki start to write .env}
    container_name: loki-gateway
    restart: unless-stopped
    environment:
      - LOKI_ENGINES=${LOKI_ENGINES:?run loki start to write .env}
    ports:
      - "${API_PORT:-8090}:8080"
    depends_on:
      - llama
    networks:
      - loki-net

  llama:
    # Built locally for one GPU architecture from a pinned llama.cpp commit.
    build:
      context: ./llama
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-}
        GPU_TARGETS: ${LLAMA_GPU_TARGETS:-gfx1100}
        ROCM_VERSION: ${LLAMA_ROCM_VERSION:-7.2.4}
    image: ${LLAMA_IMAGE:?run loki start to write .env}
    container_name: loki-llama
    restart: unless-stopped
    # Pass the AMD GPU through to the ROCm runtime.
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    volumes:
      # Mount models at their host path so preset paths resolve unchanged.
      - ${LLAMA_MODELS_DIR:-./models}:${LLAMA_MODELS_DIR:-/models}:ro
      - ./models.ini:/etc/llama/models.ini:ro
    command:
      # Serve every preset model, loading on demand and evicting the least recently used.
      - --models-preset
      - /etc/llama/models.ini
      - --models-max
      - "${LLAMA_MAX_LOADED:-1}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    networks:
      - loki-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: loki-open-webui
    restart: always
    environment:
      # Reach the gateway over the Compose network; applies until Open WebUI
      # stores its own connection settings.
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://gateway:8080/v1
      - OPENAI_API_KEY=none
    depends_on:
      - gateway
    volumes:
      - ./data/open-webui:/app/backend/data
    networks:
      - loki-net

  caddy:
    image: caddy:latest
    container_name: loki-caddy
    restart: always
    ports:
      # Expose standard web traffic port to the local network.
      - "${CADDY_PORT:-80}:80"
    volumes:
      # Mount the configuration file to define routing rules.
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - loki-net

  kiwix-serve:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: loki-kiwix
    volumes:
      # Mount the local directory to the container data folder.
      - ./data/kiwix:/data
    ports:
      - "${KIWIX_PORT:-8080}:8080"
    command:
      # Serve all archives found in the mounted directory.
      - "/data/*.zim"
    networks:
      # Attach to the custom loki-net bridge so Open WebUI can see it.
      - loki-net
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  loki-net:
    driver: bridge
